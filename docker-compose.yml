# Lokální vývoj: jen Postgres. Appka se pouští na hostu (`bun run dev`),
# protože Next v kontejneru na macOS přes bind mount zbytečně škrtí HMR.
#
# Produkce tenhle soubor nepoužívá — tam se nasazuje hotový image z GHCR,
# viz .github/workflows/deploy.yml.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: cestice
      POSTGRES_PASSWORD: cestice
      POSTGRES_DB: cestice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cestice']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
